<style>
/* くらむぼん（フロップデザイン、SIL OFL 1.1。Dela Gothic One の派生） */
@font-face{font-family:'Kuramubon';src:url('fonts/Kuramubon-subset.woff2') format('woff2');font-weight:400 900;font-display:swap}
:root{
  --navy:#221b4e; --cream:#fff8ec; --pink:#ff5c9e; --cyan:#21cdff; --lemon:#ffe03a;
  --mint:#3fe79a; --orange:#ff9a3d; --violet:#9b7dff;
  --pad:clamp(14px,3vw,40px); --gap:clamp(8px,1.2vw,16px);
  --disp:'Kuramubon','Dela Gothic One','M PLUS Rounded 1c',sans-serif;
  --body:'M PLUS Rounded 1c','Outfit',sans-serif;
  --lat:'Outfit','M PLUS Rounded 1c',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;background:var(--cream)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{font-family:var(--body);font-weight:500;color:var(--navy);background:var(--cream);overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bgSwitch{position:fixed;right:12px;bottom:12px;z-index:8000;font:700 11px/1 var(--lat,sans-serif);letter-spacing:.04em;padding:8px 12px;border:2px solid var(--navy);border-radius:99px;background-color:rgba(255,255,255,.85);color:var(--navy);box-shadow:3px 3px 0 var(--navy);opacity:.45}
#bgSwitch.on,#bgSwitch:hover,#bgSwitch:focus-visible{opacity:1}
#stage,#cut{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;z-index:0;display:block;pointer-events:none}
#stage{opacity:0}
main{position:relative;z-index:5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- intro overlay ---------- */
#intro{position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden}
.chip{display:inline-block;font-family:var(--lat);font-weight:800;letter-spacing:.08em;font-size:clamp(11px,1.1vw,15px);padding:.45em .9em;border:3px solid var(--navy);border-radius:99px;background:#fff;box-shadow:3px 3px 0 var(--navy)}
.title{position:absolute;z-index:3;left:var(--pad);top:max(13vh,66px);display:flex;align-items:center;gap:.2em;font-family:var(--disp);font-weight:400;font-size:min(8.6vw,17vh);line-height:1;pointer-events:none}
.t-icon{flex:none;width:1.12em;height:1.12em;max-width:none;border-radius:50%;object-fit:cover;background:#fff;border:.06em solid var(--navy);box-shadow:.07em .07em 0 var(--pink);transform-origin:50% 50%}

.t-en{font-family:var(--lat);font-weight:800;font-size:.2em;letter-spacing:.38em;line-height:1;padding-left:.2em;color:var(--navy)}
.mask{display:block;overflow:hidden;padding:.14em .1em .2em;margin:-.14em -.1em -.2em}
.ch{display:block;color:var(--navy);text-shadow:.05em .06em 0 var(--pink)}
.js .hero .ch,.js .hero .t-icon,.js .hero .t-en,.js .hero .t-role,.js .hero .chip,.js .hero .band,.js .hero .deco,.js .hero .screen{opacity:0}
.bands{position:absolute;z-index:1;left:-5vw;right:-5vw;bottom:5vh;height:min(24vh,220px)}
.bands-top{display:none}
.band{position:absolute;left:0;right:0;border-block:3px solid var(--navy);overflow:hidden;white-space:nowrap}
.band .mq-track{display:flex;width:max-content;will-change:transform}
.band span{font-family:var(--disp);font-size:clamp(20px,3.2vw,44px);padding:.25em .5em;line-height:1.1}
.band-a{background:var(--pink);top:18%;transform:rotate(-3deg);color:#fff}
.band-b{background:var(--lemon);top:48%;transform:rotate(2deg)}
.band-a span{text-shadow:2px 2px 0 var(--navy)}
.deco{position:absolute;z-index:0;pointer-events:none}
.deco svg{width:100%;height:100%;display:block;overflow:visible}
.d1{left:47vw;top:9vh;width:clamp(28px,4vw,56px);height:clamp(28px,4vw,56px)}
.d2{right:4vw;top:13vh;width:clamp(22px,3vw,44px);height:clamp(22px,3vw,44px)}
.d3{left:5vw;top:60vh;width:clamp(26px,3.6vw,50px);height:clamp(26px,3.6vw,50px)}
.d4{left:34vw;top:62vh;width:clamp(20px,2.6vw,38px);height:clamp(20px,2.6vw,38px)}

/* mini reel: auto-playing tilted screen in the hero */
.screen{--sw:min(50vw,calc(40vh*1.6));--sa:16/10;position:absolute;z-index:2;display:block;width:var(--sw);right:calc(var(--pad) + 1.5vw);top:max(36vh,196px)}
.scr-tilt{position:relative;transform:rotate(3.5deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.screen:hover .scr-tilt{transform:rotate(1deg) scale(1.02)}
.scr-frame{position:relative;aspect-ratio:var(--sa);border:4px solid var(--navy);border-radius:22px;overflow:hidden;background:#fff;box-shadow:10px 10px 0 var(--ac,var(--pink));transition:box-shadow .3s}
.scr-s{position:absolute;inset:0;visibility:hidden;background:#fff}
.scr-s:first-child{visibility:visible}
.scr-s .m{display:block;width:100%;height:100%;object-fit:cover}
.scr-num{position:absolute;z-index:3;left:-4%;bottom:-12%;font-family:var(--disp);line-height:.9;font-size:calc(var(--sw)*.3);color:var(--ac,var(--pink));overflow:hidden;padding:.05em .08em .1em;pointer-events:none;
  text-shadow:.022em 0 0 var(--navy),-.022em 0 0 var(--navy),0 .022em 0 var(--navy),0 -.022em 0 var(--navy),.016em .016em 0 var(--navy),-.016em .016em 0 var(--navy),.016em -.016em 0 var(--navy),-.016em -.016em 0 var(--navy),0 .05em 0 var(--navy)}
.scr-num span{display:inline-block}
.scr-ttl{position:absolute;z-index:4;right:-3%;bottom:-7%;max-width:56%;text-align:right;font-family:var(--disp);font-size:calc(clamp(15px,calc(var(--sw)*.062),34px)*var(--ts,1));line-height:1.15;pointer-events:none}
.scr-ttl .ln>span{white-space:nowrap}
.scr-ttl.wrap .ln>span{white-space:normal;text-wrap:balance;word-break:auto-phrase;line-break:strict}
.scr-ttl .ln{display:block;overflow:hidden;padding:4px 14px 14px 4px;margin:-4px -14px -14px -4px}
.scr-ttl .ln>span{display:inline-block;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:.04em .3em .08em;box-shadow:4px 4px 0 var(--ac,var(--pink))}

/* ---------- section heads (shared) ---------- */
.sec{position:relative;padding:12vh var(--pad) 4vh;max-width:calc(1360px + var(--pad)*2);margin:0 auto}
.sec.fan{padding-top:8vh;padding-bottom:10vh}
.sec-head{position:relative;margin-bottom:clamp(20px,3.5vw,44px)}
.sec-top{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(10px,2vw,28px)}
.sec h2{font-family:var(--disp);font-weight:400;font-size:clamp(46px,10.5vw,150px);line-height:1;display:flex;flex-wrap:wrap}
.sec h2 .ch2{display:inline-block;overflow:hidden;padding:.12em .07em .2em .02em;margin:-.12em -.03em -.2em 0}
.sec h2 .ch2>span{display:inline-block;color:var(--navy);text-shadow:.05em .06em 0 var(--pink)}
.stk{display:inline-block;font-family:var(--disp);font-size:clamp(20px,3.4vw,48px);line-height:1;padding:.32em .7em .38em;border:5px solid var(--navy);border-radius:14px;box-shadow:7px 7px 0 var(--navy);white-space:nowrap;transform:rotate(-6deg);will-change:transform}
.stk-games{background:var(--lemon);color:var(--navy)}
.stk-fan{background:var(--pink);color:#fff;text-shadow:2px 2px 0 var(--navy);transform:rotate(5deg)}
.sweep{display:none;position:absolute;inset:-8px calc(var(--pad)*-1);overflow:hidden;pointer-events:none;z-index:4}
.sweep i{position:absolute;top:0;bottom:0;left:0;width:34%;transform:skewX(-18deg)}
.sweep i:nth-child(1){background:var(--pink)}
.sweep i:nth-child(2){background:var(--lemon);width:20%}
.sband{position:relative;width:104vw;margin:0 0 clamp(30px,5vw,60px) calc(50% - 52vw);border-block:3px solid var(--navy);overflow:hidden;white-space:nowrap;transform:rotate(-1.4deg)}
.sband .mq-track{display:flex;width:max-content;will-change:transform}
.sband span{font-family:var(--disp);font-size:clamp(18px,2.8vw,40px);padding:.28em .5em;line-height:1.1}
.sband.a{background:var(--pink);color:#fff}
.sband.a span{text-shadow:2px 2px 0 var(--navy)}
.sband.b{background:var(--mint);color:var(--navy);transform:rotate(1.2deg)}

/* ---------- GAMES: big feature panels ---------- */
.games{display:flex;flex-direction:column;gap:clamp(24px,3.6vw,52px)}
.gp{position:relative;display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:clamp(18px,3.2vw,52px);padding:clamp(18px,3.2vw,48px);min-height:min(70vh,580px);border:4px solid var(--navy);border-radius:clamp(20px,2.6vw,36px);background:var(--ac);overflow:hidden;box-shadow:8px 8px 0 var(--navy)}
.gp.rev{grid-template-columns:1fr 1.3fr}
.gp.rev .gp-media{order:2}
.gp-bg{position:absolute;inset:-100px;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 26px,transparent 26px 52px);animation:stripes 3s linear infinite}
@keyframes stripes{to{transform:translateX(73.54px)}}
.gp-no{position:absolute;bottom:-.12em;font-family:var(--disp);font-size:clamp(150px,30vw,420px);line-height:1;color:transparent;-webkit-text-stroke:4px rgba(255,255,255,.85);pointer-events:none;white-space:nowrap;will-change:transform}
.gp:not(.rev) .gp-no{right:-1vw}
.gp.rev .gp-no{left:-1vw}
.gp-mw{position:relative;z-index:2}
.gp.rev .gp-mw{order:2}
.gp-media{position:relative;display:block;aspect-ratio:var(--ar,16/9);border-radius:22px;box-shadow:9px 9px 0 var(--navy);transform:rotate(var(--rot,-1.5deg));transform-style:preserve-3d;transition:box-shadow .35s}
.gp-mw.hv .gp-media{box-shadow:13px 15px 0 var(--navy),0 30px 56px color-mix(in srgb,var(--ac2,var(--pink)) 80%,transparent)}
.gm-clip{position:absolute;inset:0;border:4px solid var(--navy);border-radius:22px;overflow:hidden;background:#fff;isolation:isolate}
.par{position:absolute;inset:0}
.gp-media .m{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;max-width:none}
.gl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75),rgba(255,255,255,0) 52%);mix-blend-mode:overlay}
.ho{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(115deg,transparent 14%,rgba(255,92,158,.7) 30%,rgba(255,224,58,.65) 41%,rgba(63,231,154,.65) 52%,rgba(33,205,255,.7) 63%,rgba(155,125,255,.65) 74%,transparent 90%);background-size:260% 260%;background-position:var(--hx,50%) var(--hy,50%);mix-blend-mode:soft-light}
.hv .gl,.hv .ho{opacity:1}
.gm-no{position:absolute;z-index:3;left:12px;bottom:4px;font-family:var(--disp);font-size:clamp(46px,7vw,100px);line-height:.9;color:#fff;pointer-events:none;transform:translateZ(46px);
  text-shadow:3px 0 0 var(--navy),-3px 0 0 var(--navy),0 3px 0 var(--navy),0 -3px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 .06em 0 var(--navy)}
.gp-info{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(10px,1.5vw,18px);min-width:0}
.gp-tag{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gp-tag .chip.k{background:var(--navy);color:#fff;box-shadow:3px 3px 0 #fff}
/* タイトルは1行に収まるよう自動で縮小（--ts）。それでも長いものは .wrap で文節ごとに2行へ */
.gp-t{font-family:var(--disp);font-weight:400;font-size:calc(clamp(30px,4.6vw,70px)*var(--ts,1));line-height:1.12;max-width:100%}
.gp-t .ln>span{white-space:nowrap}
.gp-t.wrap .ln>span{white-space:normal;text-wrap:balance;word-break:auto-phrase;line-break:strict}
.gp-t .ln{display:block;overflow:hidden;padding:.1em .12em .2em;margin:-.1em -.12em -.2em}
.gp-t .ln>span{display:inline-block;color:#fff;
  text-shadow:3px 0 0 var(--navy),-3px 0 0 var(--navy),0 3px 0 var(--navy),0 -3px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),0 .07em 0 var(--navy),0 .1em 0 var(--navy)}
.gp-d{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:.7em 1em;font-size:clamp(13px,1.2vw,16px);line-height:1.7;box-shadow:4px 4px 0 var(--navy)}
.play{display:inline-flex;align-items:center;gap:.5em;font-family:var(--disp);font-size:clamp(18px,2vw,28px);padding:.5em 1.1em .56em;border:4px solid var(--navy);border-radius:99px;background:var(--navy);color:#fff;box-shadow:5px 5px 0 #fff}
.mag{display:inline-block;transform:translate(var(--mgx,0px),var(--mgy,0px));transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.gp-star{position:absolute;z-index:3;width:clamp(30px,4vw,56px);aspect-ratio:1;pointer-events:none}
.gp-star svg{width:100%;height:100%;display:block;overflow:visible}

/* ---------- FAN ART: masking-tape photo prints on a plain wall ---------- */
#fhText,#fhSh{font-family:var(--disp);font-weight:400}
.fh{display:block;width:min(100%,calc(clamp(46px,10.5vw,150px)*4.21));height:auto;overflow:visible}
.pal{position:absolute;right:0;top:-6px;width:clamp(70px,11vw,150px);height:auto;transform:rotate(14deg);overflow:visible;pointer-events:none}
.fan-board{position:relative;padding-top:12px}
.fgrid{--fg:clamp(14px,1.9vw,26px);display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:var(--fcell,150px);gap:var(--fg)}
.fa{position:relative;display:block}
.fa.pre{opacity:0}
.fa.in{animation:drop .8s cubic-bezier(.3,.9,.4,1) var(--d,0s) backwards}
@keyframes drop{
  0%{opacity:0;transform:translateY(-90px) rotate(-9deg) scale(1.16)}
  30%{opacity:1}
  58%{transform:translateY(0) rotate(0) scale(.965)}
  78%{transform:translateY(-6px) rotate(0) scale(1.012)}
  100%{transform:none}
}
.pr{position:absolute;inset:0;background:#fffefb;border-radius:3px;box-shadow:0 6px 14px rgba(34,27,78,.17),0 1px 3px rgba(34,27,78,.2);transform-style:preserve-3d;transition:box-shadow .3s;will-change:transform}
.fa.hv .pr{box-shadow:0 18px 30px color-mix(in srgb,var(--ac) 55%,transparent),0 4px 8px rgba(34,27,78,.25)}
.pr-clip{position:absolute;left:6px;right:6px;top:6px;bottom:24px;overflow:hidden;border-radius:1px;background:color-mix(in srgb,var(--ac) 22%,#fff);isolation:isolate}
.pr-clip .m,.pr-clip video,.pr-clip img{display:block;width:100%;height:100%;object-fit:cover}
.pr-cap{position:absolute;left:6px;right:6px;bottom:0;height:24px;display:flex;align-items:center;justify-content:center;font-family:'Yomogi','M PLUS Rounded 1c',cursive;font-size:clamp(11px,1vw,14px);line-height:1;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
.tp{position:absolute;z-index:3;left:50%;top:0;width:calc(clamp(46px,50%,96px)*var(--k,1));height:clamp(17px,1.9vw,24px);transform:translate3d(-50%,-50%,22px) rotate(var(--tr,0deg));filter:drop-shadow(0 1px 1px rgba(34,27,78,.28));pointer-events:none}
.tp b{display:block;width:100%;height:100%;transition:transform .4s cubic-bezier(.3,2,.5,1)}
.tp .p0{background:var(--tc)}
.tp .p1{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px),var(--tc)}
.tp .p2{background:radial-gradient(circle,rgba(255,255,255,.8) 1.5px,transparent 2px) 0 0/8px 8px,var(--tc)}
.tp .cz{clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 25%,calc(100% - 3px) 50%,100% 75%,calc(100% - 3px) 100%,3px 100%,0 75%,3px 50%,0 25%)}
.tp .cd{clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
.fa.in .tp b{animation:tape .3s cubic-bezier(.3,1.7,.5,1) calc(var(--d,0s) + .5s) backwards}
@keyframes tape{from{opacity:0;transform:scaleX(0) rotate(-8deg)}to{opacity:1;transform:none}}
.fa.hv .tp b{transform:rotate(3deg) scale(1.04)}
.fa.hv .tp:nth-of-type(2) b{transform:rotate(-3deg) scale(1.04)}

/* ---------- profile ---------- */
.me{position:relative;padding:6vh var(--pad) 0;text-align:center;overflow:hidden}
.me-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:5vh}
.icon-ring{position:relative;width:clamp(120px,14vw,170px);aspect-ratio:1;border-radius:50%;padding:7px;box-shadow:5px 5px 0 var(--navy);border:3px solid var(--navy);overflow:hidden}
.icon-ring::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(var(--pink),var(--lemon),var(--mint),var(--cyan),var(--violet),var(--pink));animation:ringspin 6s linear infinite}
@keyframes ringspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.icon-ring::before{animation:none}}
.icon-ring img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--navy);background:#fff}
.me h3{font-family:var(--disp);font-weight:400;font-size:clamp(28px,5vw,64px);line-height:1.1}
.me p{font-size:clamp(13px,1.3vw,16px);max-width:34em;line-height:1.7}
.xbtn{display:inline-flex;align-items:center;gap:.6em;font-family:var(--lat);font-weight:800;font-size:clamp(15px,1.6vw,20px);padding:.7em 1.4em;border:3px solid var(--navy);border-radius:99px;background:var(--navy);color:#fff;box-shadow:4px 4px 0 var(--pink)}
.xbtn{font-size:clamp(17px,1.9vw,24px);padding:.8em 1.6em}
/* clickable buttons (PLAY/WATCH, X, BG switch): sticker-style press feel. Uses individual transform props (translate/scale) on elements GSAP does not own */
.play,.xbtn,#bgSwitch{cursor:pointer;background-image:linear-gradient(var(--lemon),var(--lemon));background-repeat:no-repeat;background-position:0 0;background-size:0% 100%;transition:background-size .38s cubic-bezier(.6,0,.2,1),color .2s .08s,translate .26s cubic-bezier(.3,1.6,.5,1),scale .26s cubic-bezier(.3,1.6,.5,1),box-shadow .26s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.play>span:last-child,.xbtn>span:last-child{display:inline-block}

   ========================================================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function splashPath(cx,cy,R,n,seed,drops){
  const r=rng(seed),pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,sp=i%2===0;const rad=R*(sp?.95+r()*.5:.5+r()*.2);pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]);}
  const f=v=>v.toFixed(4);let d=`M${f(pts[0][0])},${f(pts[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)},${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)},${f(p2[0])},${f(p2[1])}`;
  }
  d+='Z';
  for(let k=0;k<(drops||0);k++){
    const a=r()*Math.PI*2,dist=R*(1.35+r()*.35),rr=R*(.05+r()*.07),x=cx+Math.cos(a)*dist,y=cy+Math.sin(a)*dist;
    d+=`M${f(x-rr)},${f(y)}a${f(rr)},${f(rr)} 0 1,0 ${f(rr*2)},0a${f(rr)},${f(rr)} 0 1,0 ${f(-rr*2)},0Z`;
  }
  return d;
}

/* bento packer: pick tile sizes from each thumbnail's aspect ratio, then search (seeded) for a layout with zero holes */
function sizeOpts(r,cols){
  if(cols<=2){
    if(r<.7)return [[1,2]];
    if(r<.95)return [[1,2],[1,1],[1,1]];
    if(r<1.3)return [[1,1],[1,1],[2,2]];
    return [[2,1],[2,1],[1,1]];
  }
  if(r<.7)return [[1,2],[2,3],[2,3]];
  if(r<.95)return [[2,3],[2,2]];
  if(r<1.3)return [[1,1],[2,2],[2,2],[3,3]];
  return [[2,1],[3,2],[3,2],[4,2]];
}
function packOnce(sizes,cols){
  const occ=[];const out=[];let rows=0;
  const get=(r,c)=>occ[r]&&occ[r][c];
  for(const [w,h] of sizes){
    let done=false;
    for(let r=0;!done;r++){
      for(let c=0;c<=cols-w&&!done;c++){
        let ok=true;
        for(let y=0;y<h&&ok;y++)for(let x=0;x<w;x++)if(get(r+y,c+x)){ok=false;break;}
        if(ok){
          for(let y=0;y<h;y++){occ[r+y]=occ[r+y]||[];for(let x=0;x<w;x++)occ[r+y][c+x]=1;}
          out.push({x:c,y:r,w,h});rows=Math.max(rows,r+h);done=true;
        }
      }
    }
  }
  let holes=0;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(!get(r,c))holes++;
  return {out,rows,holes};
}
function layoutFan(cols){
  const R=rng(cols*131+7),opts=tiles.map(t=>sizeOpts(t._w.w/t._w.h,cols));
  const target=cols<=2?17:12;let best=null,found=0;
  for(let n=0;n<40000&&found<60;n++){
    const sizes=opts.map(o=>o[Math.floor(R()*o.length)]);
    const p=packOnce(sizes,cols);
    if(p.holes>0)continue;
    found++;
    const variety=new Set(sizes.map(s=>s.join('x'))).size;
    const score=Math.abs(p.rows-target)*3-variety;
    if(!best||score<best.score)best={score,p};
  }
  if(!best){ // fallback: all small, dense flow handles it
    const p=packOnce(opts.map(o=>o[0]),cols);best={p};
  }
  tiles.forEach((t,i)=>{
    const q=best.p.out[i];
    t.style.gridColumn=(q.x+1)+' / span '+q.w;t.style.gridRow=(q.y+1)+' / span '+q.h;
  });
}

    for(let i=P.length-1;i>=0;i--){
      const q=P[i];q.life-=dt;if(q.life<=0){P.splice(i,1);continue;}
      const dr=Math.exp(-2.4*dt);q.vx*=dr;q.vy*=dr;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.rv*dt;
    }
  }
  // smooth closed blob: n control points joined through their midpoints (no corners)
  function blobPath(b,u){
    const e=Math.max(b.e,0),R=b.r*u*e,cx=W*.5+(b.hx+b.ox-W*.5)*e,cy=H*.5+(b.hy+b.oy-H*.5)*e,n=b.n,pts=[];
    for(let i=0;i<n;i++){
      const a=b.a0+i/n*6.2832,rho=R*(b.base[i]+b.amp*Math.sin(T*6.2832/b.per[i]+b.ph[i]));
      pts.push([cx+Math.cos(a)*rho,cy+Math.sin(a)*rho]);
    }
    ctx.beginPath();
    const mx=(a,c)=>(a+c)/2;
    ctx.moveTo(mx(pts[n-1][0],pts[0][0]),mx(pts[n-1][1],pts[0][1]));
    for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],mx(p[0],q[0]),mx(p[1],q[1]));}
    ctx.closePath();
  }
  function drawSet(A,m){
    for(const s of A){
      ctx.save();ctx.translate(s.px,s.py);ctx.rotate(s.rot);ctx.scale(s.s,s.s);
      ctx.globalAlpha=(.4+.42*s.z)*m;
      drawShape(s.ty,s.sz,s.stroke,s.col,3+s.z*4);
      ctx.restore();
    }
  }
  function draw(){
    ctx.setTransform(BGDPR,0,0,BGDPR,0,0);
    ctx.fillStyle='#fff8ec';ctx.fillRect(0,0,W,H);
    if(k<.999){
      const m=1-k,u=Math.sqrt(W*H);
      ctx.globalAlpha=m;ctx.lineJoin='round';
      for(const b of BL){
        if(b.e<=.001)continue;
        blobPath(b,u);const c=rgbs(b.col);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();
      }
      drawSet(HS,m);
      for(const d of D){
        const p=d.t/d.dur,ez=1-Math.pow(1-p,3),r=d.r*ez;
        ctx.globalAlpha=m*Math.pow(1-p,1.4)*.9;
        ctx.beginPath();ctx.arc(d.x,d.y,r,0,6.2832);
        ctx.fillStyle=rgbs(d.col);ctx.fill();
        ctx.strokeStyle=rgbs(d.edge);ctx.lineWidth=Math.max(1.5,11*(1-p));ctx.stroke();
      }
    }
    if(k>.001)drawSet(S,k);
    for(const q of P){
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
      ctx.globalAlpha=Math.min(1,q.life/q.max*1.6)*.9;
      drawShape(q.ty,q.sz,q.stroke,q.col,3);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  function frame(now){
    if(!running)return;
    raf=requestAnimationFrame(frame);
    if(document.hidden){last=now;return;}
    const dt=Math.min((now-last)/1000,1/20);last=now;
    step(dt);draw();
  }
  function on(b){
    if(b){
      if(running)return;running=true;resize();last=performance.now();
      if(RM){step(0);draw();}else raf=requestAnimationFrame(frame);
    }else{running=false;cancelAnimationFrame(raf);}
  }
  let rto;addEventListener('resize',()=>{clearTimeout(rto);rto=setTimeout(()=>{if(running){resize();if(RM){step(0);draw();}}},150);});
  return {on,
    isOn(){return running;},
    setMode(m,snap){kt=m==='fan'?1:0;if(snap||RM)k=kt;if(RM&&running){step(0);draw();}},
    move(x,y){ptr.x=x;ptr.y=y;ptr.on=true;},
    leave(){ptr.on=false;},
    // intro: blobs fly out of the centre one after another
    heroIn(){
      introStarted=true;
      BL.forEach((b,i)=>{gsap.killTweensOf(b);b.e=0;gsap.to(b,{e:1,duration:.95,ease:'back.out(1.9)',delay:i*.13});});
    },
    // flat disc that pops and fades (hero)
    disc(x,y,hex){
      if(!running||RM)return;
      const c=mixRGB(hexRGB(hex),CREAM,.45),ed=mixRGB(hexRGB(hex),CREAM,.15);
      if(D.length>10)D.shift();
      D.push({x,y,t:0,dur:.55+Math.random()*.15,r:(SMALL?60:80)+Math.random()*40,col:c,edge:ed});
    },
    // nearest blob glides to the (pale) accent colour
    tint(x,y,hex){
      let best=null,bd=1e9;
      for(const b of BL){const d=Math.hypot(b.hx-x,b.hy-y);if(d<bd){bd=d;best=b;}}
      if(best)best.tg=mixRGB(hexRGB(hex),CREAM,.5);
    },
    pop(cx,cy,rad){
      if(!running||RM)return;
      for(const A of [S,HS])for(const s of A){
        const dx=s.px-cx,dy=s.py-cy,d=Math.hypot(dx,dy)||1,R=rad+300;
        if(d<R){const f=1-d/R;s.vox+=dx/d*520*f*(.4+s.z);s.voy+=dy/d*520*f*(.4+s.z);s.vs+=7*f;}
      }
    },
    burst(x,y,n,off){
      if(!running||RM)return;
      const BT=['circle','tri','star','plus','semi'],cnt=n||9;
      for(let i=0;i<cnt;i++){
        const a=i/cnt*6.2832+Math.random()*.6,v=220+Math.random()*220;
        if(P.length>70)P.shift();
        P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:Math.random()*6,rv:(Math.random()-.5)*9,life:1.1,max:1.1,
          sz:12+Math.random()*14,ty:BT[i%5],col:PAL[off==null?Math.floor(Math.random()*PAL.length):wrapN((off|0)+i,PAL.length)],stroke:Math.random()<.3});
      }
    }};
})();

/* ---- background manager: cross-fades by which section sits at screen centre ---- */
const BG=(function(){
  const els={hero:$('#cut'),stage:$('#stage'),cut:$('#cut')};
  const impl={hero:Cut,stage:Stage,cut:Cut};
  let cur='hero',tm=0;
  if(Cut){Cut.setMode('hero',true);Cut.on(true);els.hero.style.opacity=1;}
  function settle(){
    for(const k in els){
      if(k===cur||els[k]===els[cur])continue;
      els[k].style.transition='none';els[k].style.opacity=0;els[k].style.zIndex=0;
      if(impl[k])impl[k].on(false);
    }
  }
  function show(name){
    if(name===cur)return;
    const old=cur;cur=name;
    if(els[old]===els[cur]){ if(Cut)Cut.setMode(cur==='cut'?'fan':'hero'); return; } // hero <-> FAN ART share the canvas
    for(const k in els){
      if(k===cur||k===old||els[k]===els[cur]||els[k]===els[old])continue;
      els[k].style.zIndex=0;
    }
    if(impl[old]){const e=els[old];e.style.opacity=getComputedStyle(e).opacity;e.style.transition='none';e.style.zIndex=1;}
    if(impl[cur]){
      const e=els[cur];if(cur!=='stage')Cut.setMode(cur==='cut'?'fan':'hero',!Cut.isOn());impl[cur].on(true);
      e.style.transition='none';e.style.zIndex=2;e.style.opacity=0;void e.offsetWidth;
      e.style.transition='opacity .5s ease';e.style.opacity=1;
    }
    clearTimeout(tm);tm=setTimeout(settle,600);
    BGSW.setActive(cur==='stage');
  }
  function pickArea(){
    const mid=innerHeight/2;
    const gh=$('#gamesHead').getBoundingClientRect(),fh=$('#fanHead').getBoundingClientRect();
    if(fh.top<=mid)return 'cut';
    if(gh.top<=mid)return 'stage';
    return 'hero';
  }
  let acc=0;
  gsap.ticker.add((time,dtms)=>{acc+=dtms;if(acc<90)return;acc=0;show(pickArea());});
  if(!RM){
    addEventListener('pointermove',e=>{
      if(e.pointerType==='touch')return;
      const i=impl[cur];if(i&&i.move)i.move(e.clientX,e.clientY);
    },{passive:true});
    document.documentElement.addEventListener('pointerleave',()=>{if(Cut)Cut.leave();if(Stage)Stage.leave();});
    addEventListener('pointerdown',e=>{
      const i=impl[cur];if(i&&i.down)i.down(e.clientX,e.clientY);
      if((cur==='cut'||cur==='hero')&&Cut){Cut.burst(e.clientX,e.clientY,cur==='hero'?5:9);if(cur==='hero')Cut.disc(e.clientX,e.clientY,ACC_HEX[Math.floor(Math.random()*6)]);}
    },{passive:true});
  }
  BGREF={area:()=>cur};
  return {
    show,
    area:()=>cur,
    panelHover(x,y){if(cur==='stage'&&Stage)Stage.ripple(x,y,1.25);},
    tileHover(t){
      if(cur!=='cut'||!Cut)return;
      const r=t.getBoundingClientRect();Cut.pop(r.left+r.width/2,r.top+r.height/2,Math.max(r.width,r.height)*.6);
    }
  };
})();

function marquee(el,speed,dir,reactive){
  const track=el.querySelector('.mq-track');let p=0,w=0,vis=true;
  const measure=()=>{w=track.scrollWidth/2;};
  measure();addEventListener('resize',measure);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);addEventListener('load',measure);
  new IntersectionObserver(e=>{vis=e[0].isIntersecting;}).observe(el);

  gsap.ticker.add((time,dtms)=>{
    if(!vis||!w)return;
    const v=dir*(speed+(reactive?Math.min(Math.abs(svel)*14,900):0));
    p+=v*dtms/1000;p=((p%w)+w)%w;
    track.style.transform=`translate3d(${-p}px,0,0)`;
  });
}

let MINI=null;
function buildMini(){
  const scr=$('#screen'),frame=$('#scrFrame'),numEl=$('#scrNum'),ttlEl=$('#scrTtl');
  if(!featured.length){scr.style.display='none';return;}
  const pad=n=>String(n).padStart(2,'0');
  const S=featured.map(w=>{
    const d=document.createElement('div');d.className='scr-s';
    d.innerHTML=w.video?`<video class="m" muted loop playsinline preload="none" poster="${esc(w.thumb)}" src="${esc(w.video)}"></video>`:`<img class="m" src="${esc(w.thumb)}" alt="" decoding="async">`;
    frame.appendChild(d);return d;
  });
  const lnHTML=i=>lnBoth(featured[i]);
  // ラベルを番号と重ならない幅（スクリーンの56%）に収める: まず縮小（下限70%）、だめなら2行
  function fitTtl(){
    ttlEl.classList.remove('wrap');ttlEl.style.setProperty('--ts','1');
    const f=parseFloat(getComputedStyle(scr).getPropertyValue('--ttlw'))||.56;
    const avail=scr.clientWidth*f-26;let w=0;
    $$('.ln>span',ttlEl).forEach(s=>{if(s.offsetParent!==null)w=Math.max(w,s.offsetWidth);});
    if(!w||avail<=0)return;
    let k=Math.min(1,avail/w);
    if(k<.7){ttlEl.classList.add('wrap');k=Math.max(.7,Math.min(1,avail/(w/2*1.2)));}
    ttlEl.style.setProperty('--ts',k.toFixed(3));
  }
  window.fitScrTitle=fitTtl;
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTtl);
  {let ft;addEventListener('resize',()=>{clearTimeout(ft);ft=setTimeout(fitTtl,120);});}
  let cur=0,busy=false,tcount=0,heroVis=true,started=false,timer=null;
  scr.style.setProperty('--ac',ACC[0]);numEl.textContent=pad(1);ttlEl.innerHTML=lnHTML(0);fitTtl();
  const panelOf=i=>panels[GAMES.indexOf(featured[i])]||panels[0];
  scr.addEventListener('click',e=>{
    e.preventDefault();const p=panelOf(cur);if(!p)return;
    if(lenis)lenis.scrollTo(p,{offset:-24,duration:1.4});else p.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});
  });
  function vids(){S.forEach((s,i)=>{const v=$('video',s);if(!v)return;if(heroVis&&started&&(i===cur||(busy&&s.style.visibility==='visible')))v.play().catch(()=>{});else v.pause();});}
  new IntersectionObserver(e=>{heroVis=e[0].isIntersecting;vids();},{threshold:.1}).observe(hero);
  function go(next){
    if(busy||next===cur||RM)return;busy=true;
    const from=S[cur],to=S[next],name=TRN[tcount++%5],t=TR[name];
    gsap.set(to,{visibility:'visible',zIndex:2});gsap.set(from,{zIndex:1});
    t.init(to);
    const nv=$('video',to);if(nv&&heroVis)nv.play().catch(()=>{});
    const tl=gsap.timeline({onComplete:()=>{
      gsap.set(from,{visibility:'hidden'});gsap.set(to,{zIndex:1});clearFx(to);
      const pv=$('video',from);if(pv)pv.pause();
      cur=next;busy=false;
    }});
    tl.add(t.play(to,t.d),0);
    tl.to(numEl,{yPercent:-125,rotation:7,duration:.26,ease:'power3.in'},0)
      .call(()=>{numEl.textContent=pad(next+1);scr.style.setProperty('--ac',ACC[next%6]);},null,.3)
      .fromTo(numEl,{yPercent:125,rotation:-7},{yPercent:0,rotation:0,duration:.55,ease:'back.out(2)'},.3);
    tl.to($$('.ln>span',ttlEl),{yPercent:-135,duration:.22,ease:'power3.in',stagger:.04},0)
      .call(()=>{
        ttlEl.innerHTML=lnHTML(next);fitTtl();const sp=$$('.ln>span',ttlEl);
        gsap.set(sp,{yPercent:135});gsap.to(sp,{yPercent:0,duration:.6,ease:'power4.out',stagger:.08,delay:.04});
      },null,.3);
    const r=scr.getBoundingClientRect();
    FX.splash(Math.max(.04,r.left/innerWidth),(r.top+r.height*.5)/innerHeight,next,1700,.8);
    FX.splash(Math.min(.96,r.right/innerWidth),(r.top+r.height*.4)/innerHeight,next+1,1700,.8);
    FX.burst(Math.min(.95,Math.max(.05,(r.left+r.width*.5)/innerWidth)),1-(r.top+r.height*.5)/innerHeight,3,600,.8,next);
    FX.tint((r.left+r.width*.5)/innerWidth,(r.top+r.height*.5)/innerHeight,next);
  }
  function schedule(){
    timer=gsap.delayedCall(3.2,()=>{
      if(heroVis&&!document.hidden&&!busy)go((cur+1)%S.length);
      schedule();
    });
  }
  MINI={start(){
    if(RM||started||S.length<2)return;started=true;
    featured.forEach(w=>{const i=new Image();i.src=w.thumb;});
    vids();schedule();
  }};
}

/* =========================================================
   7b. Springy 3D tilt / glare / parallax (shared by panels + fan prints)
   ========================================================= */
const TK=['rot','rx','ry','s','ix','iy'];
const tiltSet=new Set();
function applyTilt(it){
  const v=it.v;
  it.el.style.transform=`rotate(${v.rot.toFixed(3)}deg) perspective(900px) rotateX(${v.rx.toFixed(3)}deg) rotateY(${v.ry.toFixed(3)}deg) scale(${v.s.toFixed(4)})`;
  it.el.style.setProperty('--ix',v.ix.toFixed(2)+'px');it.el.style.setProperty('--iy',v.iy.toFixed(2)+'px');
}
function mkTilt(el,o){
  const z={rot:o.base,rx:0,ry:0,s:1,ix:0,iy:0};
  const it={el,o,v:Object.assign({},z),T:Object.assign({},z),vel:{rot:0,rx:0,ry:0,s:0,ix:0,iy:0},hov:false};
  applyTilt(it);return it;
}
gsap.ticker.add((time,dtms)=>{
  if(!tiltSet.size)return;
  const dt=Math.min(dtms/1000,1/30);
  tiltSet.forEach(it=>{
    let moving=false;
    for(const k of TK){
      const a=230*(it.T[k]-it.v[k])-15*it.vel[k];
      it.vel[k]+=a*dt;it.v[k]+=it.vel[k]*dt;
      if(Math.abs(it.vel[k])>.03||Math.abs(it.T[k]-it.v[k])>.003)moving=true;
    }
    if(!moving){for(const k of TK){it.v[k]=it.T[k];it.vel[k]=0;}tiltSet.delete(it);}
    applyTilt(it);
  });
});
function bindTilt(it,host){
  const o=it.o,T=it.T;
  const rest=()=>{T.rot=o.base;T.rx=0;T.ry=0;T.s=1;T.ix=0;T.iy=0;tiltSet.add(it);};
  host.addEventListener('pointerenter',e=>{
    if(e.pointerType==='touch')return;
    it.hov=true;host.classList.add('hv');T.rot=0;T.s=o.hoverS;tiltSet.add(it);
  });
  host.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch'||!it.hov)return;
    const r=host.getBoundingClientRect();
    const px=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),py=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    T.ry=(px-.5)*2*o.max;T.rx=-(py-.5)*2*o.max;T.ix=(.5-px)*o.par;T.iy=(.5-py)*o.par*.7;
    it.el.style.setProperty('--mx',(px*100).toFixed(1)+'%');it.el.style.setProperty('--my',(py*100).toFixed(1)+'%');
    it.el.style.setProperty('--hx',(px*100).toFixed(1)+'%');it.el.style.setProperty('--hy',(py*100).toFixed(1)+'%');
    tiltSet.add(it);
  });
  host.addEventListener('pointerleave',()=>{it.hov=false;host.classList.remove('hv');rest();});
  host.addEventListener('pointerdown',()=>{T.s=.97;tiltSet.add(it);});
  const up=()=>{T.s=it.hov?o.hoverS:1;tiltSet.add(it);};
  host.addEventListener('pointerup',up);host.addEventListener('pointercancel',()=>{it.hov=false;host.classList.remove('hv');rest();});
}

/* play-button magnet */
function buildMagnet(){
  if(!FINE||RM)return;
  const mags=$$('.mag');let raf=0,mx=0,my=0;
  addEventListener('pointermove',e=>{
    mx=e.clientX;my=e.clientY;if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;mags.forEach(m=>{
      const r=m.getBoundingClientRect();
      if(r.bottom<-150||r.top>innerHeight+150){return;}
      const cx=r.left+r.width/2,cy=r.top+r.height/2,dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy),R=Math.max(r.width,r.height)*.95;
      if(d<R){const k=(1-d/R)*.5;m.style.setProperty('--mgx',Math.round(dx*k)+'px');m.style.setProperty('--mgy',Math.round(dy*k)+'px');}
      else if(m._on){m.style.setProperty('--mgx','0px');m.style.setProperty('--mgy','0px');}
      m._on=d<R;
    });});
  },{passive:true});
}

// a slanted colour band sweeping across a section heading
function sweep(sel){
  const w=$(sel+' .sweep');if(!w||RM)return;
  const bars=$$('i',w);
  w.style.display='block';
  bars.forEach((b,k)=>{
    gsap.fromTo(b,{x:()=>-b.offsetWidth*1.6},{x:()=>w.offsetWidth+b.offsetWidth*.6,duration:.62,ease:'power3.inOut',delay:k*.09,
      onComplete:()=>{if(k===bars.length-1)w.style.display='none';}});
  });
}

      gsap.to('.sband.c',{clipPath:'inset(0 0% 0 0)',duration:.8,ease:'power4.out'});
      gsap.to(wh,{yPercent:0,rotation:0,duration:.8,ease:'back.out(2.4)',stagger:.06,delay:.15});
      gsap.to('#stkWork',{scale:1,rotation:-4,duration:.7,ease:'back.out(3)',delay:.5});

    jobs.forEach(a=>{
      const media=$('.wk-media',a),parts=$$('.wk-tag,.wk-t,.wk-d,.wk-links',a),roles=$$('.wk-role i',a),films=$$('.wk-film',a);

        gsap.to(media,{scale:1,opacity:1,duration:.8,ease:'back.out(1.8)',delay:.2,clearProps:'transform'});
        gsap.to(parts,{opacity:1,y:0,duration:.55,ease:'power3.out',stagger:.07,delay:.3});
        gsap.to(roles,{scale:1,duration:.55,ease:'back.out(3)',stagger:.12,delay:.75,clearProps:'transform'});
      }});

  }

  // videos play only when visible
  const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting)v.play().catch(()=>{});else v.pause();}),{threshold:.25});
  $$('video',gamesList).forEach(v=>io.observe(v));
  $$('video',workList).forEach(v=>io.observe(v));
  $$('video',fgrid).forEach(v=>io.observe(v));

function buildCursor(){
  if(!FINE)return;
  const cur=$('.cursor'),lab=$('.cursor-c span');
  document.body.classList.add('has-cursor');
  const xT=gsap.quickTo(cur,'x',{duration:.3,ease:'power3'}),yT=gsap.quickTo(cur,'y',{duration:.3,ease:'power3'});
  addEventListener('pointermove',e=>{ if(e.pointerType==='touch')return; xT(e.clientX);yT(e.clientY);document.body.classList.add('moved');},{passive:true});
  document.addEventListener('pointerover',e=>{
    const t=e.target.closest&&e.target.closest('[data-cursor]');
    if(t&&t.dataset.cursor!==''){lab.textContent=t.dataset.cursor;cur.classList.add('big');}
  });
  document.addEventListener('pointerout',e=>{
    const to=e.relatedTarget&&e.relatedTarget.closest?e.relatedTarget.closest('[data-cursor]'):null;
    if(!to||to.dataset.cursor==='')cur.classList.remove('big');
  });
  addEventListener('pointerdown',()=>cur.classList.add('down'));
  addEventListener('pointerup',()=>cur.classList.remove('down'));
  document.addEventListener('mouseleave',()=>document.body.classList.remove('moved'));
}

/* =========================================================
   7b. Back to top: paper plane sticker, super-jump flight on click
   ========================================================= */
function buildToTop(){
  const btn=$('#toTop'),me=$('#me');if(!btn||!me)return;
  const ico=$('.tt-ico',btn);
  const PLANE=ico.innerHTML;
  let shown=false,flying=false,hov=false;
  gsap.set(btn,{scale:0,autoAlpha:0});
  const idle=RM?null:gsap.timeline({repeat:-1,repeatDelay:2.6,paused:true})
    .to(ico,{y:-7,rotation:8,duration:.22,ease:'power2.out'})
    .to(ico,{y:0,rotation:0,duration:.6,ease:'bounce.out'});
  function setShown(v){
    if(v===shown)return;shown=v;if(flying)return;
    if(RM){gsap.set(btn,{scale:v?1:0,autoAlpha:v?1:0});return;}
    gsap.killTweensOf(btn);
    if(v){gsap.to(btn,{scale:1,autoAlpha:1,duration:.6,ease:'back.out(2.6)'});idle.restart();}
    else{gsap.to(btn,{scale:0,autoAlpha:0,duration:.25,ease:'power2.in'});idle.pause(0);}
  }
  function check(){
    if(flying)return;
    const max=document.documentElement.scrollHeight-innerHeight,prog=max>0?(window.scrollY||0)/max:0;
    setShown(me.getBoundingClientRect().top<innerHeight*.55||prog>.92);
  }
  let tacc=0;gsap.ticker.add((t,dtms)=>{tacc+=dtms;if(tacc<100)return;tacc=0;check();});
  // hover: nose up and tremble before launch
  let shake=null;
  if(!RM){
    btn.addEventListener('pointerenter',e=>{
      if(e.pointerType==='touch'||flying)return;hov=true;idle.pause(0);
      gsap.to(ico,{rotation:-14,y:-2,duration:.2,ease:'power2.out',overwrite:true});
      shake=gsap.to(ico,{x:1.6,duration:.05,repeat:-1,yoyo:true,ease:'none',delay:.2});
    });
    btn.addEventListener('pointerleave',()=>{
      if(!hov)return;hov=false;if(shake)shake.kill();
      if(!flying){gsap.to(ico,{rotation:0,x:0,y:0,duration:.35,ease:'back.out(2)',overwrite:true});if(shown)idle.restart();}
    });
  }
  // cubic bezier position + tangent angle
  const bez=(P,t)=>{const u=1-t;
    const x=u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0];
    const y=u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1];
    const dx=3*u*u*(P[1][0]-P[0][0])+6*u*t*(P[2][0]-P[1][0])+3*t*t*(P[3][0]-P[2][0]);
    const dy=3*u*u*(P[1][1]-P[0][1])+6*u*t*(P[2][1]-P[1][1])+3*t*t*(P[3][1]-P[2][1]);
    return {x,y,rot:Math.atan2(dy,dx)*57.2958+45};};   // plane artwork points up-right (-45deg)
  const mkFly=()=>{const f=document.createElement('div');f.className='tt-fly';f.innerHTML=PLANE;document.body.appendChild(f);return f;};
  function bit(x,y,k){
    const b=document.createElement('div');b.className='tt-bit';const sz=10+Math.random()*9;
    b.style.width=sz+'px';b.style.height=(k===2?4:sz)+'px';b.style.background=ACC_HEX[Math.floor(Math.random()*6)];
    if(k===0)b.style.borderRadius='50%';
    else if(k===1){b.style.border='0';b.style.clipPath='polygon(50% 0,100% 100%,0 100%)';}
    else b.style.borderRadius='4px';
    document.body.appendChild(b);
    gsap.fromTo(b,{x:x-sz/2,y:y-sz/2,scale:.2,rotation:Math.random()*90,opacity:1},
      {x:x-sz/2+(Math.random()-.5)*50,y:y-sz/2+10+Math.random()*30,scale:1,rotation:'+=120',duration:.35,ease:'back.out(2.5)'});
    gsap.to(b,{opacity:0,duration:.5,delay:.5+Math.random()*.25,ease:'power1.in',onComplete:()=>b.remove()});
  }
  function arrival(){
    const f=mkFly(),W_=innerWidth,H_=innerHeight,P=[[-90,H_*.82],[W_*.25,H_*.5],[W_*.5,H_*.02],[W_+110,H_*.1]];
    gsap.set(f,{opacity:1});
    const o={t:0};
    gsap.to(o,{t:1,duration:.7,ease:'sine.inOut',onUpdate:()=>{const q=bez(P,o.t);gsap.set(f,{x:q.x,y:q.y,rotation:q.rot,scale:.9});},onComplete:()=>f.remove()});
  }
  function launch(){
    if(flying)return;
    if(RM){if(lenis)lenis.scrollTo(0,{immediate:true});else window.scrollTo(0,0);return;}
    flying=true;hov=false;if(shake)shake.kill();idle.pause(0);
    const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,H_=innerHeight,W_=innerWidth;
    const fly=mkFly();gsap.set(fly,{x:cx,y:cy,rotation:0,scale:r.width<60?.85:1});
    gsap.set(ico,{opacity:0,x:0,y:0,rotation:0});
    if(Cut)Cut.burst(cx,cy,6);
    // page goes up at the same time
    gsap.delayedCall(.12,()=>{if(lenis)lenis.scrollTo(0,{duration:1.1});else window.scrollTo({top:0,behavior:'smooth'});});
    // button squashes, then pops out of existence
    gsap.timeline()
      .to(btn,{scaleX:1.22,scaleY:.72,duration:.14,ease:'power2.out'})
      .to(btn,{scale:0,autoAlpha:0,duration:.22,ease:'back.in(2)'});
    // plane: pull back, then arc up and out of the screen
    const P=[[cx-12,cy+10],[cx+34,cy-H_*.28],[cx-W_*.1,cy-H_*.65],[cx-W_*.04,-150]];
    const o={t:0};let nb=0;
    const tl=gsap.timeline({onComplete:()=>{
      fly.remove();gsap.set(ico,{opacity:1});flying=false;
      gsap.set(btn,{scale:0,autoAlpha:0});shown=false;
      gsap.delayedCall(.1,arrival);
    }});
    tl.to(fly,{x:cx-14,y:cy+12,rotation:-8,scale:.85,duration:.15,ease:'power2.out'})
      .to(o,{t:1,duration:.85,ease:'power2.in',onUpdate:()=>{
        const q=bez(P,o.t);gsap.set(fly,{x:q.x,y:q.y,rotation:q.rot,scale:.9+o.t*.9});
        if(nb<8&&o.t>.06+nb*.1){nb++;bit(q.x,q.y,nb%3);}
      }});
  }
  btn.addEventListener('click',launch);
}

/* ---------- ゲームタイトルの自動フィット ----------
   1) 1行に収まるまで文字を縮める（下限 62%）  2) それでも収まらなければ、文節で折り返して2行に */
function fitTitles(){
  $$('.gp-t').forEach(h=>{
    const info=h.parentElement;if(!info)return;
    h.classList.remove('wrap');h.style.setProperty('--ts','1');
    const avail=info.clientWidth-8;let w=0;
    $$('.ln>span',h).forEach(s=>{if(s.offsetParent!==null)w=Math.max(w,s.offsetWidth);});
    if(!w||avail<=0)return;
    let k=Math.min(1,avail/w);
    if(k<.62){h.classList.add('wrap');k=Math.max(.62,Math.min(1,avail/(w/2*1.18)));}
    h.style.setProperty('--ts',k.toFixed(3));
  });
}
window.fitTitles=fitTitles;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitles);
{let ft;addEventListener('resize',()=>{clearTimeout(ft);ft=setTimeout(fitTitles,120);});}

/* ---------- go ---------- */
function start(){
  fitTitles();

  addEventListener('load',()=>ScrollTrigger.refresh());
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1800))]):Promise.resolve()).then(start);
})();
